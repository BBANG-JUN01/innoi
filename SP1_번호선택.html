<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SP1팀 | 랜덤 제시어 번호 선택</title><style>
:root{font-family:Arial,'Noto Sans KR',sans-serif;color:#f4f7ff;background:#0b1630}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#213e70 0%,#0b1630 52%);display:flex;justify-content:center;align-items:center;padding:28px}.wrap{width:min(1100px,100%)}.eyebrow{color:#8db5ff;letter-spacing:.18em;font-size:14px;font-weight:800}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:clamp(30px,5vw,56px);margin:10px 0 8px}.sub{color:#bdcbe1;margin:0 0 30px;font-size:17px}.count{font-weight:800;color:#fff;background:#243c67;border-radius:16px;padding:14px 18px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.number{font-size:clamp(24px,4vw,43px);font-weight:800;color:#fff;background:linear-gradient(150deg,#3169ce,#1e438f);border:2px solid #527cce;border-radius:17px;min-height:112px;cursor:pointer;box-shadow:0 6px 16px #0003;transition:transform .12s,background .15s}.number:hover:not(:disabled){transform:translateY(-3px);background:#3a76e5}.number:disabled{background:#15243d;border-color:#2a3b54;color:#6f809c;box-shadow:none;cursor:default}.number:disabled span{display:none}.number:disabled::after{content:'사용 완료';font-size:16px}.footer{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:27px;flex-wrap:wrap}.hint{color:#bdcbe1;font-size:14px}.reset{padding:12px 18px;border-radius:12px;border:1px solid #7089b6;background:transparent;color:#dce8ff;cursor:pointer;font-weight:700}.reset:hover{background:#243c67}.overlay{position:fixed;inset:0;background:#061021e8;display:flex;align-items:center;justify-content:center;padding:24px}.overlay[hidden]{display:none}.modal{text-align:center;background:#152849;border:1px solid #5e87d1;border-radius:25px;padding:45px 65px;max-width:95vw}.modal small{color:#b8cbed;font-size:18px}.picked{font-size:clamp(70px,15vw,140px);font-weight:900;margin:10px 0 20px}.back{font-size:20px;font-weight:800;background:#3879eb;border:0;color:white;padding:15px 35px;border-radius:14px;cursor:pointer}@media(max-width:600px){.grid{gap:8px}.number{min-height:70px;border-radius:10px}.number:disabled::after{font-size:10px}.modal{padding:36px}}
</style></head><body><main class="wrap"><div class="eyebrow">ROUND 3 · RANDOM WORD</div><div class="head"><h1>랜덤 제시어 뽑기</h1><div class="count" id="count">남은 번호 20 / 20</div></div><p class="sub">번호를 누르면 사용 완료 처리됩니다. 제시어는 옆에 띄운 Google 프레젠테이션에서 확인하세요.</p><section class="grid" id="grid" aria-label="제시어 번호 선택"></section><div class="footer"><div class="hint">선택한 번호는 회색으로 바뀌며 다시 선택할 수 없습니다. 이 브라우저에 기록이 저장됩니다.</div><button class="reset" id="reset">전체 초기화</button></div></main><div class="overlay" id="overlay" hidden><div class="modal"><small>선택한 번호</small><div class="picked" id="picked"></div><button class="back" id="back">번호 선택으로 돌아가기</button></div></div><script>
(()=>{'use strict';const KEY='sp1-word-picker-used-v1';let used=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))used=x.filter(n=>Number.isInteger(n)&&n>=1&&n<=20)}catch(e){}const grid=document.getElementById('grid'),count=document.getElementById('count'),overlay=document.getElementById('overlay');function render(){grid.replaceChildren();for(let n=1;n<=20;n++){let b=document.createElement('button');b.className='number';b.disabled=used.includes(n);b.setAttribute('aria-label',n+'번'+(b.disabled?' 사용 완료':''));const s=document.createElement('span');s.textContent=n;b.append(s);b.addEventListener('click',()=>{if(used.includes(n))return;used.push(n);localStorage.setItem(KEY,JSON.stringify(used));document.getElementById('picked').textContent=n+'번';overlay.hidden=false;render()});grid.append(b)}count.textContent=`남은 번호 ${20-used.length} / 20`;}document.getElementById('back').onclick=()=>overlay.hidden=true;document.getElementById('reset').onclick=()=>{if(confirm('사용한 번호 기록을 모두 초기화할까요?')){used=[];localStorage.removeItem(KEY);overlay.hidden=true;render()}};document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.hidden=true});render()})();
</script></body></html>
